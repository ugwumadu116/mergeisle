<style>
:root{--panel:rgba(255,244,223,.92);--ink:#3b2a1a;--muted:#8a6a47;--accent:#e8743b;--teal:#2b6f6b;--star:#f4b400;--font-d:"Fraunces",Georgia,serif;--font-b:"Nunito",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--panel:rgba(36,31,58,.92);--ink:#fbeedd;--muted:#a79bc8;--accent:#ff9a5c;--teal:#5fd0c4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe8f0;font-family:var(--font-b);font-weight:600;color:var(--ink);overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:5}
#stack{position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top));z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#bot{bottom:calc(10px + env(safe-area-inset-bottom));align-items:flex-end;justify-content:center}
.box{background:var(--panel);border-radius:16px;padding:8px 12px;backdrop-filter:blur(6px);box-shadow:0 4px 0 rgba(0,0,0,.08)}
h1{font-family:var(--font-d);font-size:20px;margin:0;line-height:1}
h1 small{display:block;font-family:var(--font-b);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
#need{pointer-events:none;text-align:center;white-space:nowrap;min-width:0}
#need b{color:var(--accent)}
#need .bar{height:6px;border-radius:4px;background:rgba(0,0,0,.12);margin-top:6px;overflow:hidden}
#need .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
#hint{font-size:12px;color:var(--muted);max-width:min(78vw,420px);position:absolute;left:0;bottom:100%;margin-bottom:8px;transition:opacity .5s;pointer-events:none}#hint.off{opacity:0}
button{pointer-events:auto;font:inherit;font-weight:800;background:var(--panel);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px;min-width:44px}
.stat{display:flex;gap:10px;font-weight:800}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,0);z-index:9;background:var(--accent);color:#fff;font-family:var(--font-d);font-size:15px;padding:6px 12px;border-radius:14px;pointer-events:none;white-space:nowrap;animation:toast 1.3s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#dragtip{position:fixed;z-index:6;pointer-events:none;transform:translate(-50%,-100%);background:var(--ink);color:var(--panel);font-weight:800;font-size:13px;padding:5px 10px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#dragtip.on{opacity:1}#dragtip.ok{background:#2f8f4e;color:#fff}#dragtip.build{background:var(--accent);color:#fff}
.ftext{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--font-d);font-size:17px;color:#fff;background:rgba(43,30,18,.86);padding:3px 11px 4px;border-radius:999px;border:2px solid rgba(255,255,255,.85);text-shadow:0 1px 0 rgba(0,0,0,.4);box-shadow:0 3px 0 rgba(0,0,0,.18);animation:ft 1s forwards;white-space:nowrap}
@keyframes ft{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.stat{align-items:center}.stat button{padding:2px 6px;background:transparent;font-size:18px}#bot .btns{display:flex;gap:8px;pointer-events:none;align-items:center}#need .nl{font-size:14px}#need .chain{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:5px;font-size:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;border:2px solid #fff;box-shadow:0 1px 0 rgba(0,0,0,.2)}.chip.tgt{width:26px;height:26px;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.18)}}.chip.top{border-color:#ffd23f;box-shadow:0 0 0 2px rgba(255,210,63,.55)}.chain .arr{opacity:.6}.chain .nm{color:var(--ink);font-weight:800;margin-left:3px}#bot button{min-height:44px;padding:6px 14px}#top .stat button{font-size:16px}
#need.done .bar i{background:var(--star)}#needtxt{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:12px}#need .chain{margin-top:0}#need .lockrow{margin-top:0}#need .bar{margin-top:5px;height:5px}
@media (max-width:480px){#need .bt{display:none}#need{padding:6px 10px 7px}}
@media (max-width:480px){#need{font-size:13px}#need .nl{font-size:13px}h1 small{display:none}.box{padding:7px 11px}#hint{font-size:11px}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,244,200,.55),rgba(255,244,200,0) 70%)}#flash.on{animation:fl .45s}@keyframes fl{0%{opacity:.9}100%{opacity:0}}

/* ---------- rewards UI */
:root{--panel-solid:#fff4df;--gold:#f4b400;--ok:#2f8f4e}
@media (prefers-color-scheme:dark){:root{--panel-solid:#2a2446}}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
.lft{display:flex;align-items:center;gap:14px}
.cur{display:flex;align-items:center;gap:5px;font-weight:800;font-size:18px;min-width:56px;font-variant-numeric:tabular-nums;transform-origin:left center}
.cur .ic{width:22px;height:22px}.cur.pop{animation:cpop .32s}@keyframes cpop{40%{transform:scale(1.28)}}
.ttl{display:none}
#row2{display:flex;flex-direction:column;gap:6px}
#orders{display:flex;gap:6px}
.ord{position:relative;flex:1;min-width:0;background:var(--panel);border-radius:14px;padding:6px 8px 7px;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .18s,box-shadow .18s;pointer-events:none}
.ord.enter{animation:oin .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes oin{from{opacity:0;transform:translateY(-14px) scale(.82)}}
.ord .r1{padding-right:12px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.vp{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:2px solid #fff;flex:none;line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.vn{display:none;font-size:12px;color:var(--muted);flex:1;margin-left:2px}
.rw{display:flex;gap:7px;font-size:12px;font-weight:800;align-items:center;font-variant-numeric:tabular-nums}
.rw span{display:inline-flex;align-items:center;gap:2px}.rw .ic{width:14px;height:14px}
.ord .r2{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .chip{width:20px;height:20px;font-size:11px;flex:none}
.ord.ready{box-shadow:0 0 0 2px var(--gold),0 3px 0 rgba(0,0,0,.08)}
.ord.ready{animation:wantp 1.1s ease-in-out infinite}@media(min-width:700px){.ord.ready .r2::after{content:'drag here';font-size:9px;color:var(--accent);margin-left:auto;text-transform:uppercase;letter-spacing:.04em}}
.ord.want{box-shadow:0 0 0 2px var(--ok),0 3px 0 rgba(0,0,0,.08);animation:wantp .8s ease-in-out infinite}
@keyframes wantp{50%{transform:scale(1.04)}}
.ord.over{transform:scale(1.09);box-shadow:0 0 0 3px var(--ok),0 8px 18px rgba(0,0,0,.2);animation:none}
.ord.done{box-shadow:0 0 0 3px var(--ok),0 3px 0 rgba(0,0,0,.08);animation:none;transform:scale(1.06)}
.ord.done::after{content:'\2713';position:absolute;inset:0;display:grid;place-items:center;font-size:34px;font-weight:800;color:#fff;background:rgba(47,143,78,.88);border-radius:14px;animation:oin .3s both}
.ord.out{animation:oout .45s forwards}@keyframes oout{to{opacity:0;transform:translateY(-16px) scale(.9)}}
.sk{position:absolute;top:-12px;right:-9px;width:32px;height:32px;min-width:0;min-height:0;padding:0;border-radius:50%;font-size:13px;line-height:1;background:var(--panel-solid);box-shadow:0 1px 0 rgba(0,0,0,.2);color:var(--muted);pointer-events:auto;opacity:.85}
.sk::before{content:'';position:absolute;inset:-6px}
.lockrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px;font-size:12px;color:var(--muted)}
#startbtn{pointer-events:auto;background:var(--accent);color:#fff;min-height:30px;padding:3px 12px;font-size:12px;opacity:.5}
#startbtn.go{opacity:1;animation:pulse 1.2s ease-in-out infinite}
@media(min-width:700px){.ttl{display:block}#row2{flex-direction:row;justify-content:center;align-items:stretch}#orders .ord{width:158px;flex:none}.vn{display:block}.rw{gap:6px}}
.fly{position:fixed;left:0;top:0;width:22px;height:22px;z-index:40;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}.fly .ic{width:22px;height:22px}
.spk{position:fixed;z-index:39;pointer-events:none;width:14px;height:14px}.spk .ic{width:14px;height:14px}
#combo{position:fixed;right:12px;z-index:8;pointer-events:none;background:var(--ink);color:var(--panel-solid);border-radius:14px;padding:5px 12px 7px;font-family:var(--font-d);font-size:20px;opacity:0;transform:scale(.7);transition:opacity .2s,transform .25s cubic-bezier(.2,1.5,.4,1);text-align:center}
#combo.on{opacity:1;transform:scale(1)}#combo small{display:block;font-family:var(--font-b);font-size:11px;font-weight:800;color:var(--gold)}
#combo .cb{height:3px;border-radius:2px;background:var(--gold);margin-top:3px;transform-origin:left}#combo.on .cb{animation:cb 2.5s linear forwards}@keyframes cb{to{transform:scaleX(0)}}
#combo.hit{animation:chit .25s}@keyframes chit{40%{transform:scale(1.18)}}
.newpop{position:fixed;left:50%;top:33%;z-index:10;pointer-events:none;transform:translate(-50%,-50%);text-align:center;background:linear-gradient(#ffd23f,#f4a259);color:#3b2a1a;border-radius:18px;padding:8px 20px 10px;box-shadow:0 5px 0 rgba(0,0,0,.18);animation:npop 1.9s forwards;border:3px solid #fff}
.newpop b{display:block;font-family:var(--font-d);font-size:26px;line-height:1;letter-spacing:.04em}.newpop span{font-size:14px;font-weight:800}
@keyframes npop{0%{opacity:0;transform:translate(-50%,-30%) scale(.5) rotate(-6deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.btns{display:flex;gap:6px;pointer-events:none;align-items:center;justify-content:center;flex-wrap:nowrap}
.btns button{position:relative;padding:6px 12px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
.dot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#e8452b;border:2px solid var(--panel-solid);display:none}
.dot.on{display:block;animation:pulse 1.1s ease-in-out infinite}
#placebar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:9;display:none;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#placebar.on{display:flex}#placebar .pt{font-size:13px;flex:1 1 140px;min-width:0}#placebar .pt b{display:block;font-family:var(--font-d);font-size:16px}
#placebar .pb{display:flex;gap:6px;flex-wrap:wrap}#placebar button{min-height:40px;padding:5px 12px;font-size:13px;background:var(--panel-solid);box-shadow:0 2px 0 rgba(0,0,0,.12)}
#placebar button.pri{background:var(--accent);color:#fff}#placebar button[disabled]{opacity:.45}
.modal{position:fixed;inset:0;z-index:20;background:rgba(30,20,10,.45);display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}
.sheet{pointer-events:auto;width:min(580px,100%);max-height:86vh;background:var(--panel-solid);border-radius:22px 22px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow:auto;display:flex;flex-direction:column;gap:10px;animation:sup .3s cubic-bezier(.2,1,.3,1);box-shadow:0 -6px 30px rgba(0,0,0,.25)}
@keyframes sup{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px;max-height:80vh}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.sh-h h2{margin:0;font-family:var(--font-d);font-size:22px}
.sh-h .bal{display:flex;gap:12px;font-weight:800;font-size:15px;align-items:center}
#mx{min-width:40px;min-height:40px;padding:0;background:rgba(0,0,0,.07)}
.tabs{display:flex;gap:6px}.tabs button{flex:1;min-height:40px;background:rgba(0,0,0,.06);font-size:14px}.tabs button.on{background:var(--ink);color:var(--panel-solid)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.dc{background:rgba(0,0,0,.05);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.dc img{width:88px;height:88px;object-fit:contain}.dc .nm{font-weight:800;font-size:14px}.dc small{font-size:11px;color:var(--muted)}
.dc button{min-height:38px;padding:4px 14px;font-size:14px;background:var(--accent);color:#fff;width:100%;display:flex;gap:5px;align-items:center;justify-content:center}.dc button[disabled]{opacity:.4}
.dc button.alt{background:rgba(0,0,0,.1);color:var(--ink)}.dc .two{display:flex;gap:6px;width:100%}
.mr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.05);align-items:center}
.mr.done{background:rgba(47,143,78,.16)}.mr .nm{font-weight:800;font-size:14px}.mr .ds{font-size:12px;color:var(--muted)}
.mr .rwd{font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center;justify-content:flex-end;text-align:right}
.mr .pbar{grid-column:1/-1;height:7px;border-radius:4px;background:rgba(0,0,0,.12);overflow:hidden}.mr .pbar i{display:block;height:100%;background:var(--teal);border-radius:4px}.mr.done .pbar i{background:var(--ok)}
.mr .pn{font-size:11px;color:var(--muted);font-weight:800}
.list{display:flex;flex-direction:column;gap:8px;padding-top:10px}
#celeb{position:fixed;left:50%;top:max(8px,env(safe-area-inset-top));z-index:15;pointer-events:auto;cursor:pointer;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));text-align:center;background:var(--panel-solid);border:3px solid var(--gold);border-radius:20px;padding:6px 14px 8px;box-shadow:0 5px 0 rgba(0,0,0,.14);opacity:0;display:none}#celeb.on{display:block}
#celeb.on{animation:cel 1.6s forwards}#celeb small{font-size:10px;font-weight:800;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}#celeb b{display:inline-block;font-family:var(--font-d);font-size:17px;margin:0 8px}#celeb .rwd{font-weight:800;font-size:14px;display:inline-flex;gap:10px;justify-content:center;align-items:center}
@keyframes cel{0%{opacity:0;transform:translate(-50%,-30px)}12%{opacity:1;transform:translate(-50%,0)}86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
.dchest{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.dchest svg.chest{width:150px;height:130px;overflow:visible}.dchest .lid{transform-origin:20px 62px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}.dchest.open .lid{transform:rotate(-38deg) translateY(-6px)}
.dchest.shake svg.chest{animation:shk .5s}@keyframes shk{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
.pips{display:flex;gap:6px;justify-content:center}.pip{width:34px;height:40px;border-radius:10px;background:rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted)}.pip.on{background:var(--gold);color:#3b2a1a}.pip.cur{outline:3px solid var(--accent)}
.bigbtn{background:var(--accent);color:#fff;min-height:48px;font-size:16px;padding:8px 26px;box-shadow:0 4px 0 rgba(0,0,0,.15)}.bigbtn[disabled]{background:rgba(0,0,0,.12);color:var(--muted);box-shadow:none}
.muted{color:var(--muted);font-size:13px}
.ftext svg{vertical-align:-3px}
</style>
</head>

<script>
{const w=console.warn;console.warn=(...a)=>{if(!/KHR_texture_transform/.test(String(a[0])))w.apply(console,a)}}

    setHint(`${lab} needs ${CH[s.chain].names[s.tier]} (${CH[s.chain].name} tier ${s.tier+1}).`,3200);sfx('bad');return false;

// villager orders
const VIL=[{n:'Ada',e:'👩🏾‍🌾',c:'#f0b36b'},{n:'Tunde',e:'👨🏾‍🔧',c:'#7cc5b8'},{n:'Zainab',e:'👵🏾',c:'#d3a0dc'}];
const ORD_R=[null,{c:22,s:1},{c:50,s:2},{c:110,s:3},{c:220,s:5}];
const reach=()=>Object.keys(S.seen).reduce((m,k)=>Math.max(m,+k.slice(-1)||0),0);
const matchOrder=(c,o)=>!!(c&&o&&c.chain===o.chain&&c.tier===o.tier);
function newOrder(slot){
  const maxT=Math.min(4,Math.max(1,reach()+1)),st=(S.started&&!completing&&S.stage<STAGES.length)?STAGES[S.stage]:null,others=S.orders.filter((o,i)=>o&&i!==slot);
  const w=[0,3,3,2,1];let pick=null;
  for(let n=0;n<60&&!pick;n++){
    let tot=0;for(let t=1;t<=maxT;t++)tot+=w[t];let r=Math.random()*tot,tier=1;for(let t=1;t<=maxT;t++){r-=w[t];if(r<=0){tier=t;break}}
    const chain=KEYS[Math.floor(Math.random()*KEYS.length)];
    if(others.some(o=>o.chain===chain&&o.tier===tier)||(S.orders[slot]&&S.orders[slot].chain===chain&&S.orders[slot].tier===tier))continue;
    if(st&&chain===st.chain&&(tier===st.tier?Math.random()<.9:Math.random()<.35))continue;
    pick={chain,tier};
  }
  if(!pick){const cur=S.orders[slot],all=[];for(let t=1;t<=Math.max(maxT,2);t++)for(const k of KEYS)all.push({chain:k,tier:t});
    const ok=all.filter(q=>!others.some(o=>o.chain===q.chain&&o.tier===q.tier)&&!(cur&&cur.chain===q.chain&&cur.tier===q.tier));
    const ok2=ok.filter(q=>!(st&&q.chain===st.chain&&q.tier===st.tier));const pl=ok2.length?ok2:ok.length?ok:all;pick=pl[Math.floor(Math.random()*pl.length)]}
  const R=ORD_R[pick.tier];return{v:slot,chain:pick.chain,tier:pick.tier,coins:R.c,stars:R.s,id:S.oid++};
}
function ensureOrders(){for(let i=0;i<3;i++){const o=S.orders[i];if(!o||!CH[o.chain]||!(o.tier>=1&&o.tier<=4)||S.orders.some((q,j)=>j<i&&q&&q.chain===o.chain&&q.tier===o.tier))S.orders[i]=newOrder(i)}S.orders.length=3}
const orderEls=[],ordBox=$('orders');
function orderHTML(o){const V=VIL[o.v];return `<div class="r1"><span class="vp" style="background:${V.c}">${V.e}</span><span class="vn">${V.n}</span><span class="rw"><span>${ic('coin')}${o.coins}</span><span>${ic('star')}${o.stars}</span></span></div><div class="r2">${chipH(o.chain,o.tier)}${CH[o.chain].names[o.tier]}</div><button class="sk" aria-label="Swap this order" title="Swap this order">✕</button>`}

function deliverOrder(slot,i){
